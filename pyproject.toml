[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-collector-pro"
version = "2.0.0"
description = "Autonomous AI B-Roll & Stock Media Collector Pro"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antigravity Multi-Agent Suite" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "pillow>=10.2.0"
]

[project.scripts]
stock-collector = "cli:main"
stock-collector-ui = "app:main"

[tool.pyright]
extraPaths = [".", "src"]
include = ["."]
executionEnvironments = [
    { root = "." }
]
