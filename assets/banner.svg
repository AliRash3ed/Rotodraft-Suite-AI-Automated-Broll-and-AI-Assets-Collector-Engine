<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F" />
      <stop offset="50%" stop-color="#14141F" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    
    <!-- Aurora Glows -->
    <radialGradient id="aurora1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0" />
    </radialGradient>

    <!-- Font definition -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&amp;family=Space+Grotesk:wght@700;900&amp;display=swap');
      .title { font-family: 'Space Grotesk', sans-serif; font-weight: 900; fill: #FFFFFF; font-size: 52px; letter-spacing: -1.5px; }
      .tagline { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #FFE600; font-size: 22px; letter-spacing: 0.5px; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 13px; text-transform: uppercase; }
      .author { font-family: 'JetBrains Mono', monospace; font-weight: 700; fill: #A0A0B0; font-size: 14px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#bgGrad)" />
  <rect width="1200" height="440" fill="url(#aurora1)" />
  <rect width="1200" height="440" fill="url(#aurora2)" />
  <rect width="1200" height="440" fill="url(#aurora3)" />

  <!-- Grid Blueprint Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="100" y1="0" x2="100" y2="440" />
    <line x1="300" y1="0" x2="300" y2="440" />
    <line x1="600" y1="0" x2="600" y2="440" />
    <line x1="900" y1="0" x2="900" y2="440" />
    <line x1="1100" y1="0" x2="1100" y2="440" />
  </g>

  <!-- Outer Hero Card Border (Neo-Brutalist Frame) -->
  <rect x="24" y="24" width="1152" height="392" rx="10" fill="none" stroke="#333340" stroke-width="3" />
  
  <!-- Brand Icon Group -->
  <g transform="translate(60, 60)">
    <!-- Shadow -->
    <rect x="8" y="8" width="90" height="90" rx="8" fill="#00F0FF" />
    <!-- Icon Box -->
    <rect x="0" y="0" width="90" height="90" rx="8" fill="#FFE600" stroke="#000000" stroke-width="4" />
    <path d="M0 26H90" stroke="#000000" stroke-width="4" />
    <path d="M20 0L30 26" stroke="#000000" stroke-width="3.5" />
    <path d="M45 0L55 26" stroke="#000000" stroke-width="3.5" />
    <path d="M70 0L80 26" stroke="#000000" stroke-width="3.5" />
    <polygon points="34,44 62,59 34,74" fill="#00F0FF" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Title & Headline -->
  <text x="175" y="110" class="title">ROTODRAFT SUITE</text>
  <text x="175" y="145" class="tagline">AI-Powered Stock Media &amp; B-Roll Collector Studio</text>
  
  <text x="60" y="200" font-family="'Space Grotesk', sans-serif" font-size="16px" fill="#D0D0E0" font-weight="500">
    Automate voiceover synthesis, 1-shot script decomposition, 3s retention trimming, and CapCut / Premiere XML exports.
  </text>

  <!-- Feature Badges -->
  <!-- Badge 1: 100% Free AI -->
  <g transform="translate(60, 240)">
    <rect x="4" y="4" width="230" height="42" fill="#000000" />
    <rect x="0" y="0" width="230" height="42" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
    <text x="20" y="26" class="badge-text" fill="#000000">⚡ 100% FREE AI MODELS</text>
  </g>

  <!-- Badge 2: Multi Stock Scraping -->
  <g transform="translate(305, 240)">
    <rect x="4" y="4" width="265" height="42" fill="#000000" />
    <rect x="0" y="0" width="265" height="42" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="18" y="26" class="badge-text" fill="#000000">🎬 PEXELS + PIXABAY + PINTEREST</text>
  </g>

  <!-- Badge 3: Edge-TTS -->
  <g transform="translate(585, 240)">
    <rect x="4" y="4" width="235" height="42" fill="#000000" />
    <rect x="0" y="0" width="235" height="42" fill="#CCFF00" stroke="#000000" stroke-width="2.5" />
    <text x="18" y="26" class="badge-text" fill="#000000">🎙️ FREE NEURAL VOICEOVER</text>
  </g>

  <!-- Badge 4: CapCut & Premiere -->
  <g transform="translate(835, 240)">
    <rect x="4" y="4" width="280" height="42" fill="#000000" />
    <rect x="0" y="0" width="280" height="42" fill="#FF3366" stroke="#000000" stroke-width="2.5" />
    <text x="18" y="26" class="badge-text" fill="#FFFFFF">✂️ CAPCUT &amp; PREMIERE XML</text>
  </g>

  <!-- Bottom Timeline Mockup Bar -->
  <g transform="translate(60, 310)">
    <!-- Track Container -->
    <rect x="0" y="0" width="1055" height="44" rx="4" fill="#181824" stroke="#404055" stroke-width="2" />
    
    <!-- Video Track Blocks -->
    <rect x="6" y="6" width="160" height="32" rx="3" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
    <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="800" fill="#000000">01_city_traffic [3s]</text>

    <rect x="172" y="6" width="160" height="32" rx="3" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <text x="184" y="26" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="800" fill="#000000">02_server_room [3s]</text>

    <rect x="338" y="6" width="160" height="32" rx="3" fill="#CCFF00" stroke="#000000" stroke-width="1.5" />
    <text x="350" y="26" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="800" fill="#000000">03_stock_chart [3s]</text>

    <rect x="504" y="6" width="160" height="32" rx="3" fill="#FF3366" stroke="#000000" stroke-width="1.5" />
    <text x="516" y="26" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="800" fill="#FFFFFF">04_ai_neural [3s]</text>

    <rect x="670" y="6" width="160" height="32" rx="3" fill="#A370F7" stroke="#000000" stroke-width="1.5" />
    <text x="682" y="26" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="800" fill="#FFFFFF">05_handshake [3s]</text>

    <rect x="836" y="6" width="210" height="32" rx="3" fill="#282838" stroke="#FFE600" stroke-dasharray="3 3" stroke-width="1.5" />
    <text x="850" y="26" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="800" fill="#FFE600">Full_Video_Master.mp4</text>
  </g>

  <!-- Footer Credit -->
  <text x="60" y="390" class="author">
    Engineered by Ali Rasheed Bhatti • Lahore, Pakistan • Open Source under MIT License
  </text>
</svg>
