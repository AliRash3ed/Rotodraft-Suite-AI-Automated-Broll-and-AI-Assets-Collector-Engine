      <path d="m22 12.5-8.58 3.9a2 2 0 0 1-1.66 0L2 12.5M22 17.5l-8.58 3.9a2 2 0 0 1-1.66 0L2 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

