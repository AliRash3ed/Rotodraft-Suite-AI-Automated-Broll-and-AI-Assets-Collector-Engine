    </g>

    <!-- Play -->
    <g id="icon-play">
      <polygon points="6 3 20 12 6 21 6 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/>
    </g>

    <!-- Pause -->
    <g id="icon-pause">
      <rect x="6" y="4" width="4" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/>
      <rect x="14" y="4" width="4" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/>
    </g>

